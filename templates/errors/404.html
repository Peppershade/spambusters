{% extends "base.html" %}

{% block title %}404 Not Found - Spambuster{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 80px; color: var(--accent-primary); margin-bottom: 16px;">
        <i class="fa-solid fa-ghost"></i>
    </div>
    <h1 style="font-size: 48px; font-weight: 700; color: var(--accent-primary); margin-bottom: 8px;">404</h1>
    <h2 style="font-size: 22px; color: var(--text-primary); margin-bottom: 12px;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 32px;">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
